<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cave Game</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Chiller", "Old English Text MT", "Informal Roman", cursive;
    }

    .screen {
        display: none;
        height: 100vh;
        width: 100vw;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
    }

    .active {
        display: flex;
    }

    /* ---------- INTRO SCREEN ---------- */
    #intro {
        background: url("cave-bg(1).jpg") center/cover no-repeat;
        color: #f5f5f5;
        text-shadow: 2px 2px 6px black;
    }

    #intro h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
    }

    #intro h2 {
        font-size: 1.5rem;
        margin: 0.5rem 0;
    }

    #intro p {
        font-size: 1.2rem;
        margin-bottom: 1.5rem;
    }

    button {
        padding: 12px 24px;
        font-size: 1.2rem;
        cursor: pointer;
        border: none;
        border-radius: 6px;
    }

    #enterBtn {
        background: #2e2e2e;
        color: #fff;
    }

    /* ---------- DOOR SCREEN ---------- */
    #doors {
        background: radial-gradient(circle, #1f5f2a 0%, #000 70%);
        color: white;
    }

    .door-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .door {
        width: 80px;
        height: 180px;
        background: linear-gradient(145deg, #4b2e1a, #2b160b);
        border: 3px solid #1a0d05;
        border-radius: 6px;
        position: relative;
        cursor: pointer;
        transition: transform 0.3s;
    }

    .door:hover {
        transform: scale(1.05);
    }

    .knob {
        width: 12px;
        height: 12px;
        background: gold;
        border-radius: 50%;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
    }

    /* ---------- DEATH SCREEN ---------- */
    #death {
        background: radial-gradient(circle, darkred 0%, green 70%);
        color: darkred;
    }

    #death h1 {
        font-size: 3rem;
        color: darkred;
    }

    .skull {
        font-size: 6rem;
    }

    /* ---------- TREASURE SCREEN ---------- */
    #treasure {
        background: radial-gradient(circle, gold 0%, green 70%);
        color: #8b6b00;
    }

    #treasure h1 {
        font-size: 3rem;
        color: gold;
    }

    .chest {
        font-size: 6rem;
    }
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" class="screen active">
    <h1>Cave Game</h1>
    <h2>Do you have what it takes to get the treasure?</h2>
    <p>Play if you dare</p>
    <button id="enterBtn">Enter the Cave</button>
</div>

<!-- DOORS -->
<div id="doors" class="screen">
    <h2>Choose a Door</h2>
    <p>Choice <span id="step">1</span> of 5</p>
    <div class="door-container" id="doorContainer"></div>
</div>

<!-- DEATH -->
<div id="death" class="screen">
    <div class="skull">☠️</div>
    <h1>YOU DIED</h1>
    <button onclick="restartGame()">wanna play again?</button>
</div>

<!-- TREASURE -->
<div id="treasure" class="screen">
    <div class="chest">💰🏆</div>
    <h1>YOU WIN</h1>
    <button onclick="restartGame()">Play Again</button>
</div>

<script>
let currentStep = 1;
const totalSteps = 5;

document.getElementById("enterBtn").onclick = () => {
    showScreen("doors");
    generateDoors();
};

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function generateDoors() {
    const container = document.getElementById("doorContainer");
    container.innerHTML = "";

    let doorCount = currentStep <= 2 ? 2 : 3;

    for (let i = 0; i < doorCount; i++) {
        const door = document.createElement("div");
        door.className = "door";

        const knob = document.createElement("div");
        knob.className = "knob";
        door.appendChild(knob);

        door.onclick = () => chooseDoor(i, doorCount);
        container.appendChild(door);
    }

    document.getElementById("step").textContent = currentStep;
}

function chooseDoor(choice, doorCount) {
    const safeDoor = Math.floor(Math.random() * doorCount);

    if (choice !== safeDoor) {
        showScreen("death");
        return;
    }

    currentStep++;

    if (currentStep > totalSteps) {
        showScreen("treasure");
    } else {
        generateDoors();
    }
}

function restartGame() {
    currentStep = 1;
    showScreen("intro");
}
</script>

</body>
</html>
