<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cave Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;
      background: black;
      color: white;
      text-align: center;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .active {
      display: block;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    input {
      padding: 10px;
      font-size: 16px;
    }

    .consent {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<!-- ========== START SCREEN ========== -->
<div id="startScreen" class="screen active">
  <h1>Cave Game</h1>
  <p>Do you have what it takes to get the treasure?</p>

  <input type="text" id="playerNameInput" placeholder="Enter your name" />

  <br>
  <button onclick="startGame()">Enter the Cave</button>

  <p class="consent">
    By playing, you consent to anonymous local data collection for academic purposes.
  </p>
</div>

<!-- ========== GAME SCREEN (your doors go here) ========== -->
<div id="gameScreen" class="screen">
  <h2>Choose a door</h2>
  <!-- YOUR DOOR LOGIC / BUTTONS GO HERE -->
</div>

<!-- ========== END SCREEN ========== -->
<div id="endScreen" class="screen">
  <h2 id="endMessage"></h2>
  <p id="timeText"></p>
  <button onclick="location.reload()">Play again?</button>
</div>

<!-- ========== HIDDEN FORM (DATA SUBMISSION) ========== -->
<form
  id="dataForm"
  action="https://script.google.com/macros/s/AKfycbzGBh8r0BKG7evKwX6rLKtTkM9naObZzN1DsJDt2gtWl55ladgE2Jh8e5bNGgmxSoklDw/exec"
  method="POST"
  target="hidden_iframe"
  style="display:none;"
>
  <input type="text" name="player_name" id="formPlayerName">
  <input type="text" name="result" id="formResult">
  <input type="text" name="time_taken" id="formTime">
  <input type="text" name="round_reached" id="formRound">
</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
  let startTime;
  let playerName = "";
  let currentRound = 0;

  function startGame() {
    playerName = document.getElementById("playerNameInput").value.trim();
    if (!playerName) {
      alert("Please enter your name");
      return;
    }

    startTime = Date.now();
    currentRound = 1;

    showScreen("gameScreen");
  }

  function endGame(result) {
    const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(2);

    document.getElementById("endMessage").innerText =
      result === "Win" ? "You found the treasure!" : "You died.";

    document.getElementById("timeText").innerText =
      "Time taken: " + elapsedTime + " seconds";

    submitGameData(playerName, result, elapsedTime, currentRound);

    showScreen("endScreen");
  }

  function submitGameData(playerName, result, timeTaken, roundReached) {
    document.getElementById("formPlayerName").value = playerName;
    document.getElementById("formResult").value = result;
    document.getElementById("formTime").value = timeTaken;
    document.getElementById("formRound").value = roundReached;

    document.getElementById("dataForm").submit();
  }

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  /* 
    👉 EXAMPLE USAGE:
    Call endGame("Win") when treasure is found
    Call endGame("Death") when wrong door chosen
  */
</script>

</body>
</html>
