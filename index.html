<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cave Game</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Times New Roman", serif;
}

body {
  margin: 0;
  color: white;
}

/* ---------- SCREENS ---------- */
.screen {
  display: none;
  min-height: 100vh;
  padding: 20px;
}

.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ---------- START ---------- */
#start {
  background: url("cave-bg(1).JPG") center/cover no-repeat;
  position: relative;
}

#start::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

#start * {
  position: relative;
  z-index: 1;
}

h1 {
  font-size: 3rem;
}

.subtitle {
  font-size: 1.4rem;
  margin: 6px 0;
}

input {
  padding: 10px;
  font-size: 1.1rem;
  margin: 15px 0;
}

button {
  padding: 12px 20px;
  font-size: 1.1rem;
  cursor: pointer;
}

/* ---------- GAME ---------- */
#game {
  background: radial-gradient(circle, #1e7f2b 0%, #000 70%);
}

.timer {
  font-size: 1.3rem;
  margin-bottom: 20px;
}

.doors {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
  justify-content: center;
}

.door {
  width: 90px;
  height: 210px;
  background: linear-gradient(#3b1f0f, #2a140a);
  border: 3px solid #1a0d06;
  border-radius: 6px;
  position: relative;
  cursor: pointer;
  transition: transform 0.25s;
}

.door:hover {
  transform: scale(1.06);
}

.knob {
  width: 14px;
  height: 14px;
  background: gold;
  border-radius: 50%;
  position: absolute;
  right: 15px;
  top: 50%;
}

/* ---------- DEATH ---------- */
#death {
  background: radial-gradient(circle, red 0%, green 70%);
}

.skull {
  font-size: 5rem;
}

.death-text {
  color: darkred;
  font-size: 3rem;
}

/* ---------- WIN ---------- */
#win {
  background: radial-gradient(circle, yellow 0%, green 70%);
  color: black;
}

.treasure {
  font-size: 4rem;
}

.leaderboard {
  margin-top: 20px;
  text-align: left;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen active">
  <h1>Cave Game</h1>
  <div class="subtitle">Do you have what it takes to get the treasure?</div>
  <div class="subtitle">Play if you dare</div>

  <input id="playerName" placeholder="Enter your name">
  <button onclick="startGame()">Enter the Cave</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="timer">Time: <span id="time">0.00</span>s</div>
  <div class="doors" id="doors"></div>
</div>

<!-- DEATH -->
<div id="death" class="screen">
  <div class="skull">☠️</div>
  <div class="death-text">YOU DIED</div>
  <button onclick="resetGame()">Wanna play again?</button>
</div>

<!-- WIN -->
<div id="win" class="screen">
  <div class="treasure">💰💎</div>
  <h1>You Win</h1>
  <div id="result"></div>
  <div class="leaderboard" id="leaderboard"></div>
  <button onclick="resetGame()">Play Again</button>
</div>

<script>
let round = 0;
let timer;
let startTime;
let name = "";

/*
Final difficulty:
Round 5 has only ONE safe (treasure)
*/
const rounds = [
  { doors: 2, safe: 1 },
  { doors: 2, safe: 1 },
  { doors: 3, safe: 2 },
  { doors: 3, safe: 2 },
  { doors: 3, safe: 1 } // FINAL TREASURE
];

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startGame() {
  name = document.getElementById("playerName").value.trim();
  if (!name) return alert("Enter your name!");

  round = 0;
  startTime = Date.now();
  timer = setInterval(updateTimer, 50);
  show("game");
  renderDoors();
}

function updateTimer() {
  document.getElementById("time").textContent =
    ((Date.now() - startTime) / 1000).toFixed(2);
}

function renderDoors() {
  const container = document.getElementById("doors");
  container.innerHTML = "";

  const { doors, safe } = rounds[round];

  let outcomes = Array(safe).fill(true)
    .concat(Array(doors - safe).fill(false))
    .sort(() => Math.random() - 0.5);

  outcomes.forEach(isSafe => {
    const d = document.createElement("div");
    d.className = "door";
    d.innerHTML = `<div class="knob"></div>`;
    d.onclick = () => chooseDoor(isSafe);
    container.appendChild(d);
  });
}

function chooseDoor(isSafe) {
  if (!isSafe) {
    clearInterval(timer);
    show("death");
    return;
  }

  round++;
  if (round === rounds.length) win();
  else renderDoors();
}

function win() {
  clearInterval(timer);
  const time = (Date.now() - startTime) / 1000;
  saveScore(name, time);
  show("win");
  showResults(time);
}

function saveScore(name, time) {
  let data = JSON.parse(localStorage.getItem("caveScores") || "[]");
  data.push({ name, time });
  data.sort((a, b) => a.time - b.time);
  data = data.slice(0, 10);
  localStorage.setItem("caveScores", JSON.stringify(data));
}

function showResults(time) {
  const data = JSON.parse(localStorage.getItem("caveScores") || "[]");
  const rank = data.findIndex(d => d.name === name && d.time === time) + 1;

  document.getElementById("result").innerHTML =
    `Your time: ${time.toFixed(2)}s<br>Your rank: ${rank || "Unranked"}`;

  let html = "<h3>Top 10 Explorers</h3>";
  data.forEach((d, i) => {
    html += `${i + 1}. ${d.name} — ${d.time.toFixed(2)}s<br>`;
  });

  document.getElementById("leaderboard").innerHTML = html;
}

function resetGame() {
  location.reload();
}
</script>

</body>
</html>
