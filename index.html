<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cave Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: "Times New Roman", serif;
    color: white;
  }

  .screen {
    display: none;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }

  .active {
    display: block;
  }

  /* ---------- BACKGROUNDS ---------- */

  #startScreen {
    background: url("cave-bg(1).JPG") center/cover no-repeat;
  }

  #gameScreen {
    background: radial-gradient(circle, #1f4f2e 0%, #000 70%);
  }

  #deathScreen {
    background: radial-gradient(circle, darkred 0%, green 70%);
  }

  #winScreen {
    background: radial-gradient(circle, gold 0%, green 70%);
  }

  /* ---------- UI ---------- */

  button {
    padding: 14px 22px;
    font-size: 16px;
    cursor: pointer;
    margin: 12px;
  }

  input {
    padding: 10px;
    font-size: 16px;
  }

  .doors {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
  }

  .door {
    width: 90px;
    height: 180px;
    background: #3b2416;
    border: 3px solid #d4af37;
    cursor: pointer;
  }

  .timer {
    font-size: 18px;
    margin-top: 10px;
  }

  .consent {
    font-size: 10px;
    opacity: 0.7;
    margin-top: 10px;
  }
</style>
</head>

<body>

<!-- ========== START SCREEN ========== -->
<div id="startScreen" class="screen active">
  <h1>Cave Game</h1>
  <p>Do you have what it takes to get the treasure?</p>

  <input id="playerName" placeholder="Enter your name">
  <br>
  <button onclick="startGame()">Enter the Cave</button>

  <p class="consent">
    By playing, you consent to anonymous data collection for academic purposes.
  </p>
</div>

<!-- ========== GAME SCREEN ========== -->
<div id="gameScreen" class="screen">
  <h2 id="roundText"></h2>
  <div class="timer" id="timer">Time: 0.0s</div>
  <div class="doors" id="doors"></div>
</div>

<!-- ========== DEATH SCREEN ========== -->
<div id="deathScreen" class="screen">
  <h1 style="color: darkred;">YOU DIED ☠️</h1>
  <p id="deathInfo"></p>
  <button onclick="location.reload()">Wanna play again?</button>
</div>

<!-- ========== WIN SCREEN ========== -->
<div id="winScreen" class="screen">
  <h1 style="color: gold;">YOU WIN 💰</h1>
  <p id="winInfo"></p>
  <button onclick="location.reload()">Play again?</button>
</div>

<!-- ========== HIDDEN FORM (GOOGLE SHEETS) ========== -->
<form
  id="dataForm"
  action="PASTE_YOUR_WEB_APP_URL_HERE"
  method="POST"
  target="hidden_iframe"
  style="display:none;"
>
  <input name="player_name" id="f_name">
  <input name="result" id="f_result">
  <input name="time_taken" id="f_time">
  <input name="round_reached" id="f_round">
</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
let player = "";
let startTime;
let timerInterval;
let round = 1;
let safeDoor = 0;

function startGame() {
  player = document.getElementById("playerName").value.trim();
  if (!player) {
    alert("Enter name");
    return;
  }

  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 100);
  round = 1;
  show("gameScreen");
  setupRound();
}

function updateTimer() {
  document.getElementById("timer").innerText =
    "Time: " + ((Date.now() - startTime) / 1000).toFixed(1) + "s";
}

function setupRound() {
  document.getElementById("roundText").innerText = "Round " + round;
  const doors = document.getElementById("doors");
  doors.innerHTML = "";

  const doorCount = round <= 2 ? 2 : 3;
  safeDoor = Math.floor(Math.random() * doorCount);

  for (let i = 0; i < doorCount; i++) {
    const d = document.createElement("div");
    d.className = "door";
    d.onclick = () => chooseDoor(i);
    doors.appendChild(d);
  }
}

function chooseDoor(choice) {
  if (choice === safeDoor) {
    if (round === 5) {
      endWin();
    } else {
      round++;
      setupRound();
    }
  } else {
    endDeath();
  }
}

function endDeath() {
  clearInterval(timerInterval);
  const time = ((Date.now() - startTime) / 1000).toFixed(2);
  document.getElementById("deathInfo").innerText =
    `Time: ${time}s | Round: ${round}`;
  submitData("Death", time, round);
  show("deathScreen");
}

function endWin() {
  clearInterval(timerInterval);
  const time = ((Date.now() - startTime) / 1000).toFixed(2);
  document.getElementById("winInfo").innerText =
    `Time: ${time}s`;
  submitData("Win", time, 5);
  show("winScreen");
}

function submitData(result, time, roundReached) {
  document.getElementById("f_name").value = player;
  document.getElementById("f_result").value = result;
  document.getElementById("f_time").value = time;
  document.getElementById("f_round").value = roundReached;
  document.getElementById("dataForm").submit();
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
