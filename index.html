<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cave Game</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Times New Roman", serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* ---------- START SCREEN ---------- */
    #start {
      background: url("cave-bg(1).JPG") center/cover no-repeat;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      margin: 5px 0;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      width: 80%;
      max-width: 280px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .consent {
      font-size: 10px;
      color: #ddd;
      margin-top: 8px;
    }

    /* ---------- GAME SCREEN ---------- */
    #game {
      background: radial-gradient(circle, darkgreen 0%, black 70%);
    }

    .timer {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .doors {
      display: flex;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .door {
      width: 70px;
      height: 140px;
      background: #3b2a1a;
      border-radius: 6px;
      border: 2px solid gold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .door:hover {
      transform: scale(1.05);
    }

    /* ---------- DEATH ---------- */
    #death {
      background: radial-gradient(circle, darkred 0%, green 70%);
    }

    .skull {
      font-size: 80px;
    }

    .dead-text {
      color: darkred;
      font-size: 36px;
    }

    /* ---------- TREASURE ---------- */
    #win {
      background: radial-gradient(circle, gold 0%, green 70%);
    }

    .treasure {
      font-size: 70px;
    }

    /* ---------- LEADERBOARD ---------- */
    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <!-- START -->
  <div id="start" class="screen active">
    <h1>Cave Game</h1>
    <h2>Do you have what it takes to get the treasure?</h2>
    <h2>Play if you dare</h2>

    <input id="playerName" placeholder="Enter your name" />
    <button onclick="startGame()">Enter the Cave</button>

    <div class="consent">
      By playing, you consent to anonymous local data collection for academic purposes.
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="screen">
    <div class="timer" id="timer">Time: 0.0s</div>
    <h2 id="roundText"></h2>
    <div class="doors" id="doors"></div>
  </div>

  <!-- DEATH -->
  <div id="death" class="screen">
    <div class="skull">💀</div>
    <div class="dead-text">YOU DIED</div>
    <button onclick="restart()">Wanna play again?</button>
  </div>

  <!-- WIN -->
  <div id="win" class="screen">
    <div class="treasure">💰</div>
    <h1 style="color: goldenrod;">YOU WIN</h1>
    <h3 id="rankText"></h3>

    <h2>Leaderboard (Top 10)</h2>
    <ul id="leaderboard"></ul>

    <button onclick="restart()">Play Again</button>
  </div>

<script>
  let round = 1;
  let startTime;
  let timerInterval;
  let player = "";

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function startGame() {
    player = document.getElementById("playerName").value || "Anonymous";
    round = 1;
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);
    show("game");
    nextRound();
  }

  function updateTimer() {
    let t = ((Date.now() - startTime) / 1000).toFixed(1);
    document.getElementById("timer").innerText = "Time: " + t + "s";
  }

  function nextRound() {
    document.getElementById("roundText").innerText = "Round " + round;
    const doorsDiv = document.getElementById("doors");
    doorsDiv.innerHTML = "";

    let doorCount = round <= 2 ? 2 : round <= 4 ? 3 : 3;
    let safeDoor = round === 5 ? Math.floor(Math.random() * doorCount) : Math.floor(Math.random() * doorCount);

    for (let i = 0; i < doorCount; i++) {
      let d = document.createElement("div");
      d.className = "door";
      d.innerText = "Door";
      d.onclick = () => chooseDoor(i === safeDoor);
      doorsDiv.appendChild(d);
    }
  }

  function chooseDoor(safe) {
    if (!safe) {
      clearInterval(timerInterval);
      show("death");
      return;
    }

    if (round === 5) {
      winGame();
    } else {
      round++;
      nextRound();
    }
  }

  function winGame() {
    clearInterval(timerInterval);
    let timeTaken = ((Date.now() - startTime) / 1000).toFixed(2);

    let data = JSON.parse(localStorage.getItem("caveLeaderboard") || "[]");
    data.push({ name: player, time: parseFloat(timeTaken) });
    data.sort((a, b) => a.time - b.time);
    data = data.slice(0, 10);
    localStorage.setItem("caveLeaderboard", JSON.stringify(data));

    let rank = data.findIndex(e => e.name === player && e.time == timeTaken) + 1;
    document.getElementById("rankText").innerText = `Your time: ${timeTaken}s | Rank: #${rank}`;

    let ul = document.getElementById("leaderboard");
    ul.innerHTML = "";
    data.forEach((e, i) => {
      let li = document.createElement("li");
      li.innerText = `${i + 1}. ${e.name} — ${e.time}s`;
      ul.appendChild(li);
    });

    show("win");
  }

  function restart() {
    show("start");
  }
</script>

</body>
</html>
