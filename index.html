<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cave Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;
      background: black;
      color: white;
      text-align: center;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 20px;
    }

    .active {
      display: block;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin: 10px;
    }

    .doors {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 40px;
    }

    .door {
      width: 80px;
      height: 180px;
      background: #4b2e1e;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
    }

    .door::after {
      content: "";
      width: 12px;
      height: 12px;
      background: gold;
      border-radius: 50%;
      position: absolute;
      right: 10px;
      top: 50%;
    }
  </style>
</head>

<body>

<!-- START SCREEN -->
<div id="start" class="screen active"
     style="background:url('cave-bg(1).JPG') center/cover no-repeat;">
  <h1>Cave Game</h1>
  <p>Do you have what it takes to get the treasure?</p>
  <p><i>Play if you dare</i></p>

  <input id="playerName" placeholder="Enter your name" />
  <br><br>
  <button onclick="startGame()">Enter the Cave</button>

  <p style="font-size:10px;margin-top:20px;">
    By playing, you consent to anonymous local data collection for academic purposes.
  </p>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">
  <h2 id="roundText"></h2>
  <div class="doors" id="doors"></div>
  <p>⏱ Time: <span id="timer">0.0</span>s</p>
</div>

<!-- DEATH SCREEN -->
<div id="death" class="screen"
     style="background:radial-gradient(red, green);">
  <h1 style="color:darkred;">☠ YOU DIED ☠</h1>
  <button onclick="restart()">Wanna play again?</button>
</div>

<!-- WIN SCREEN -->
<div id="win" class="screen"
     style="background:radial-gradient(yellow, green);">
  <h1 style="color:gold;">💰 YOU WIN 💰</h1>
  <p>Your Rank: <span id="rank"></span></p>
  <button onclick="restart()">Play Again</button>
</div>

<!-- HIDDEN FORM -->
<form id="dataForm"
      action="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"
      method="POST"
      target="hidden_iframe">
  <input name="name" id="formName">
  <input name="result" id="formResult">
  <input name="time" id="formTime">
</form>
<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
let round = 1;
let startTime;
let timerInterval;

function startGame() {
  document.getElementById("start").classList.remove("active");
  document.getElementById("game").classList.add("active");
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 100);
  nextRound();
}

function updateTimer() {
  document.getElementById("timer").textContent =
    ((Date.now() - startTime) / 1000).toFixed(1);
}

function nextRound() {
  document.getElementById("roundText").textContent = "Round " + round;
  const doorsDiv = document.getElementById("doors");
  doorsDiv.innerHTML = "";

  let totalDoors = round <= 2 ? 2 : 3;

  // ✅ SAFE DOOR LOGIC (ONLY CHANGE IS HERE)
  let safeDoors = [];
  if (round === 3 || round === 4) {
    // 2 SAFE DOORS IN ROUNDS 3 & 4
    while (safeDoors.length < 2) {
      let r = Math.floor(Math.random() * totalDoors);
      if (!safeDoors.includes(r)) safeDoors.push(r);
    }
  } else {
    // ALL OTHER ROUNDS: 1 SAFE DOOR
    safeDoors = [Math.floor(Math.random() * totalDoors)];
  }

  for (let i = 0; i < totalDoors; i++) {
    const door = document.createElement("div");
    door.className = "door";
    door.onclick = () => chooseDoor(i, safeDoors);
    doorsDiv.appendChild(door);
  }
}

function chooseDoor(choice, safeDoors) {
  if (!safeDoors.includes(choice)) {
    endGame("LOSE");
    return;
  }

  if (round === 5) {
    endGame("WIN");
    return;
  }

  round++;
  nextRound();
}

function endGame(result) {
  clearInterval(timerInterval);

  document.getElementById("game").classList.remove("active");
  document.getElementById(result === "WIN" ? "win" : "death")
    .classList.add("active");

  document.getElementById("formName").value =
    document.getElementById("playerName").value;
  document.getElementById("formResult").value = result;
  document.getElementById("formTime").value =
    ((Date.now() - startTime) / 1000).toFixed(2);

  document.getElementById("dataForm").submit();
}

function restart() {
  location.reload();
}
</script>

</body>
</html>
